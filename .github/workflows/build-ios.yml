name: Build iOS IPA (Hooplab)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Hooplab IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project Hooplab.xcodeproj -scheme Hooplab

      - name: Build Archive (No Code Signing Required)
        run: |
          xcodebuild -project Hooplab.xcodeproj \
            -scheme Hooplab \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Hooplab.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create IPA Package
        run: |
          mkdir -p build/Payload
          cp -R build/Hooplab.xcarchive/Products/Applications/Hooplab.app build/Payload/
          cd build
          zip -qr ../Hooplab.ipa Payload
          cd ..
          ls -lh Hooplab.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hooplab-iOS-IPA
          path: Hooplab.ipa
          retention-days: 14
